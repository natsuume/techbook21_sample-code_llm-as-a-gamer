[project]
name = "llm-as-a-gamer-ch04"
version = "0.1.0"
description = "技術同人誌『LLM as a Gamer』第4章のサンプルコード"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "llm-as-a-gamer-sample-code",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "httpx>=0.28.1",
]

[project.scripts]
switch2-agent = "switch2_agent.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# プロジェクト名とパッケージ名が異なるため、同梱するパッケージを明示する
packages = ["src/switch2_agent"]

[tool.uv.sources]
llm-as-a-gamer-sample-code = { path = "../ch02_setup", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
