[project]
name = "run-dashboard"
version = "0.1.0"
description = "第4章のサンプルの試行を見るダッシュボードのサーバー"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.6",
    "llm-as-a-gamer-ch04",
    "uvicorn>=0.54.0",
]

[project.scripts]
run-dashboard = "run_dashboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# プロジェクト名とパッケージ名が異なるため、同梱するパッケージを明示する
packages = ["src/run_dashboard"]

[tool.uv.sources]
llm-as-a-gamer-ch04 = { path = "../../ch04_techniques", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
