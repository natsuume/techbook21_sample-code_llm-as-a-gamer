[project]
name = "llm-as-a-gamer-sample-code"
version = "0.1.0"
description = "技術同人誌『LLM as a Gamer』のサンプルコード"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
]

[project.scripts]
switch2-remote-daemon = "switch2_remote.daemon:main"
switch2-remote = "switch2_remote.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# プロジェクト名とパッケージ名が異なるため、同梱するパッケージを明示する (controller_bridge.ps1 も含まれる)
packages = ["src/switch2_remote"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
